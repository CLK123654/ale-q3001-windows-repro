name: q3001-windows-repro
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: reference
        type: choice
        options: [reference, verify]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Helm3.18.4
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://get.helm.sh/helm-v3.18.4-windows-amd64.zip -OutFile $env:RUNNER_TEMP\helm.zip
          Expand-Archive $env:RUNNER_TEMP\helm.zip -DestinationPath $env:RUNNER_TEMP\helm
          $helm = Join-Path $env:RUNNER_TEMP helm\windows-amd64\helm.exe
          "HELM_PATH=$helm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $hostInfo = [ordered]@{ caption=(Get-CimInstance Win32_OperatingSystem).Caption; version=(Get-CimInstance Win32_OperatingSystem).Version; build=(Get-CimInstance Win32_OperatingSystem).BuildNumber; runner_image=$env:ImageOS; commit_sha=$env:GITHUB_SHA; workflow_run_id=$env:GITHUB_RUN_ID }
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/windows-host.json
          & $env:HELM_PATH version --short | Set-Content -Encoding utf8NoBOM evidence/helm-version.txt
      - name: Generate Reference candidate
        if: ${{ inputs.mode == 'reference' }}
        shell: pwsh
        run: python ./qa/generate_reference.py
      - name: Verify final task
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pythonPath = (Get-Command python).Source
          New-NetFirewallRule -DisplayName q3001-python-no-external -Direction Outbound -Program $pythonPath -Action Block | Out-Null
          New-NetFirewallRule -DisplayName q3001-helm-no-external -Direction Outbound -Program $env:HELM_PATH -Action Block | Out-Null
          Get-NetFirewallRule -DisplayName q3001-*-no-external | Select-Object DisplayName,Enabled,Direction,Action | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/network-guard.json
          python ./qa/verify_hashes.py
          python ./qa/windows_verify.py
      - name: Remove process network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q3001-*-no-external -ErrorAction SilentlyContinue | Remove-NetFirewallRule
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3001-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
